# CodeRabbit configuration for OpenVision
# Docs: https://docs.coderabbit.ai/reference/configuration

language: "en-US"

reviews:
  # "chill" keeps findings focused on real issues instead of style nitpicks.
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!docs/images/**"
    - "!**/*.png"
    - "!**/*.gif"
    - "!**/*.xcodeproj/**"

  path_instructions:
    - path: "OpenVision/**/*.swift"
      instructions: |
        This is an iOS 18+ SwiftUI voice-first math/exam solver for Meta Ray-Ban glasses using
        Gemini REST SSE (v2.1 structured format), Apple Speech + Silero VAD (FluidAudio),
        VietMathSpeech + ReadingEngine, and Meta Wearables DAT SDK. Pay special attention to:
        - Pure Foundation boundary: OpenVision/Services/Speech/ must compile on Linux (no UIKit,
          SwiftUI, Combine, AVFoundation, OSLog, or `as NSString`).
        - Concurrency & Hang Risk: @MainActor isolation, keeping blocking AVAudioSession calls
          off the main thread, and avoiding state races between VoiceCommandService, ReadingEngine,
          TTSService, and GeminiLiveService.
        - Audio-session invariants (PLAN.md Lessons 1-4): single shared mic tap, stable
          .playAndRecord/.default options for glasses HFP, >= 350ms echo settle delay after TTS,
          and setting .speaking + isBargeInPaused before queueing speech.
        - Privacy & security: never log API keys/prefixes/tokens; gate user text on verboseLogging;
          Camera Roll fallback must only read Meta/Ray-Ban/Stories albums.
        Do not comment on Xcode project structure, code sign settings, or asset files.

chat:
  auto_reply: true
