name: Build Unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build OpenVision IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure configuration files
        run: |
          if [ ! -f Config.xcconfig ]; then
            cp Config.xcconfig.example Config.xcconfig
          fi
          if [ ! -f OpenVision/Config/Config.swift ]; then
            cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          fi
          echo "Configuration files verified:"
          cat Config.xcconfig

      - name: Blueprint guard
        # Blueprint §3 invariants, before spending a long build on a regression.
        run: python3 scripts/blueprint/verify_blueprint.py

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('OpenVision.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build OpenVision Release App
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData/Build/Products -name "OpenVision.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y OpenVision.ipa Payload

      - name: Verify IPA contents (Blueprint checklist test 6)
        run: bash scripts/blueprint/verify_ipa_symbols.sh OpenVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVision-unsigned
          path: OpenVision.ipa
