name: Build Unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build Reybain IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure configuration files
        run: |
          if [ ! -f Config.xcconfig ]; then
            cp Config.xcconfig.example Config.xcconfig
          fi
          if [ ! -f Reybain/Config/Config.swift ]; then
            cp Reybain/Config/Config.swift.example Reybain/Config/Config.swift
          fi
          echo "Configuration files verified"

      - name: Blueprint guard & pbxproj self-test
        run: |
          python3 scripts/blueprint/verify_blueprint.py
          python3 scripts/pbxproj_files.py --self-test

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Reybain.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build Reybain Release App
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reybain.xcodeproj \
            -scheme Reybain \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
          | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData/Build/Products -name "Reybain.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Reybain.app not found in DerivedData/Build/Products"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          if [ ! -f "Payload/Reybain.app/Reybain" ]; then
            echo "::error::Payload/Reybain.app/Reybain binary missing"
            exit 1
          fi
          zip -r -y Reybain.ipa Payload
          ls -lh Reybain.ipa

      - name: Verify IPA contents (strict — fails on missing required symbols)
        run: |
          chmod +x scripts/blueprint/verify_ipa_symbols.sh
          bash scripts/blueprint/verify_ipa_symbols.sh Reybain.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Reybain-unsigned
          path: Reybain.ipa
