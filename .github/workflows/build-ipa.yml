name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      mwdat_mode:
        description: "Meta Wearables DAT mode (developer = MetaAppID 0 for Sideloadly; production = Wearables Developer Center credentials)"
        type: choice
        options:
          - developer
          - production
        default: developer
      meta_app_id:
        description: "Optional Meta App ID (empty/0 in developer mode; numeric ID in production mode, or configure META_APP_ID var/secret)"
        type: string
        default: ""
      apple_team_id:
        description: "Optional 10-char Apple Team ID for MWDAT.TeamID (developer mode uses this input only and never pulls APPLE_TEAM_ID secret; production falls back to APPLE_TEAM_ID secret)"
        type: string
        default: ""
      omit_empty_team_id:
        description: "Developer mode only (leave apple_team_id empty): omit MWDAT.TeamID key instead of writing empty string (Spike S5 A/B toggle; rejected in production)"
        type: boolean
        default: false
      bundle_id:
        description: "Optional CFBundleIdentifier override (defaults to Config.xcconfig or PRODUCT_BUNDLE_IDENTIFIER var)"
        type: string
        default: ""
      url_scheme:
        description: "Meta AI callback URL scheme (custom scheme like 'openvision' in developer mode, or https:// Universal Link in production)"
        type: string
        default: "openvision"

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build OpenVision IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure configuration files
        run: |
          if [ ! -f Config.xcconfig ]; then
            cp Config.xcconfig.example Config.xcconfig
          fi
          if [ ! -f OpenVision/Config/Config.swift ]; then
            cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          fi
          echo "Configuration files verified"

      - name: Blueprint guard
        run: python3 scripts/blueprint/verify_blueprint.py

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('OpenVision.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build OpenVision Release App
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Patch MWDAT configuration and package IPA
        env:
          INPUT_MWDAT_MODE: ${{ inputs.mwdat_mode }}
          INPUT_META_APP_ID: ${{ inputs.meta_app_id }}
          VAR_META_APP_ID: ${{ vars.META_APP_ID }}
          SECRET_META_APP_ID: ${{ secrets.META_APP_ID }}
          INPUT_APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_OMIT_EMPTY_TEAM_ID: ${{ inputs.omit_empty_team_id }}
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
          VAR_BUNDLE_ID: ${{ vars.PRODUCT_BUNDLE_IDENTIFIER }}
          INPUT_URL_SCHEME: ${{ inputs.url_scheme }}
          SECRET_META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf Payload OpenVision.ipa
          mkdir -p Payload
          if [ -d "DerivedData/Build/Products/Release-iphoneos/OpenVision.app" ]; then
            APP_PATH="DerivedData/Build/Products/Release-iphoneos/OpenVision.app"
          else
            APP_PATH="$(find DerivedData/Build/Products -maxdepth 2 -type d -name "OpenVision.app" | sed -n '1p')"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::OpenVision.app not found in DerivedData/Build/Products"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -Rp "$APP_PATH" Payload/

          MWDAT_MODE="${INPUT_MWDAT_MODE:-developer}"
          OMIT_EMPTY_TEAM_ID="${INPUT_OMIT_EMPTY_TEAM_ID:-false}"
          RESOLVED_META_APP_ID="${INPUT_META_APP_ID:-}"
          RESOLVED_BUNDLE_ID="${INPUT_BUNDLE_ID:-${VAR_BUNDLE_ID:-}}"
          RESOLVED_URL_SCHEME="${INPUT_URL_SCHEME:-openvision}"

          if [ "$MWDAT_MODE" = "production" ]; then
            if [ "$OMIT_EMPTY_TEAM_ID" = "true" ]; then
              echo "::error::omit_empty_team_id=true is only allowed in developer mode"
              exit 1
            fi
            if [ -z "$RESOLVED_META_APP_ID" ]; then
              RESOLVED_META_APP_ID="${VAR_META_APP_ID:-${SECRET_META_APP_ID:-}}"
            fi
            RESOLVED_TEAM_ID="${INPUT_APPLE_TEAM_ID:-${SECRET_APPLE_TEAM_ID:-}}"
            export MWDAT_CLIENT_TOKEN="${SECRET_META_CLIENT_TOKEN:-}"
          else
            # Developer mode: never pull repository secrets (APPLE_TEAM_ID / META_APP_ID / META_CLIENT_TOKEN)
            # into public Developer Mode IPAs, and never override omit_empty_team_id=true.
            RESOLVED_TEAM_ID="${INPUT_APPLE_TEAM_ID:-}"
            export MWDAT_CLIENT_TOKEN=""
          fi
          export MWDAT_TEAM_ID="$RESOLVED_TEAM_ID"

          python3 -B scripts/blueprint/patch_ipa_mwdat.py \
            --plist="Payload/OpenVision.app/Info.plist" \
            --mode="$MWDAT_MODE" \
            --meta-app-id="$RESOLVED_META_APP_ID" \
            --bundle-id="$RESOLVED_BUNDLE_ID" \
            --url-scheme="$RESOLVED_URL_SCHEME" \
            --omit-empty-team-id="$OMIT_EMPTY_TEAM_ID"

          zip -r -y OpenVision.ipa Payload

      - name: Verify IPA contents (Blueprint checklist test 6)
        run: |
          chmod +x scripts/blueprint/verify_ipa_symbols.sh
          bash scripts/blueprint/verify_ipa_symbols.sh OpenVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVision-unsigned
          path: OpenVision.ipa
