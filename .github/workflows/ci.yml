name: CI

# Compiles the app and its test target on every pull request and push to main, and runs the fast
# pure-Swift Services/Speech test suites before invoking xcodebuild so logic regressions fail in seconds.
#
# Standard GitHub-hosted macOS runners are free for public repositories. Keep this on plain `macos-*`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build app + tests (iOS device, unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Static blueprint guard & pbxproj self-test
        run: |
          python3 scripts/blueprint/verify_blueprint.py
          python3 scripts/pbxproj_files.py --self-test

      - name: Run pure-Swift Speech/Reading tests (fast)
        run: scripts/swift-local/run.sh

      - name: Provide the gitignored config files
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp Reybain/Config/Config.swift.example Reybain/Config/Config.swift

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Reybain.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Reybain.xcodeproj \
            -scheme Reybain \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
          | xcbeautify --renderer github-actions

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
