name: E2E (Blueprint)

# End-to-end checks for the OpenVision v2 voice-first solver workflow (see PLAN.md).
#   1. blueprint-guard  — seconds, on Linux: source-level guards for Lessons 1-7, logging, camera-on-demand,
#                         v2 UI integrity, secret leaks, and pbxproj round-trip self-test.
#   2. simulator-e2e    — every OpenVisionTests suite on an iOS 18+ iPhone simulator (a manual
#                         run can tick blueprint_only for the Blueprint suites alone), including
#                         GeminiLiveService v2.1 streaming, VietMathSpeech, ReadingEngine, TTS,
#                         and the real Photo Library (Meta album filter).
#   3. live Gemini      — opt-in (workflow_dispatch -> live_gemini): real Gemini API smoke tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_gemini:
        description: "Also run the live Gemini smoke test (calls the real API)"
        type: boolean
        default: false
      blueprint_only:
        description: "Run only the Blueprint suites"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  blueprint-guard:
    name: Blueprint guard (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify blueprint invariants and pbxproj tool
        run: |
          python3 scripts/blueprint/verify_blueprint.py
          python3 scripts/pbxproj_files.py --self-test

  simulator-e2e:
    name: Blueprint E2E (iOS simulator)
    needs: blueprint-guard
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('OpenVision.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build and run the E2E suites
        env:
          SUITE: ${{ inputs.blueprint_only && 'blueprint' || 'all' }}
          XCBEAUTIFY_ARGS: --renderer github-actions
          TEST_RUNNER_OPENVISION_LIVE_GEMINI: ${{ inputs.live_gemini && '1' || '' }}
          TEST_RUNNER_OPENVISION_GEMINI_API_KEYS: ${{ inputs.live_gemini && secrets.GEMINI_API_KEYS || '' }}
        run: scripts/e2e/run-simulator-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult
          path: build/E2E.xcresult
          if-no-files-found: ignore
